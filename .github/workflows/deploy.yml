name: Deploy to Azure Static Web Apps

# Provisions (idempotently) and deploys the app as an Azure Static Web App —
# free tier, global CDN. Same pattern as the IgnyteCheerDance site: requires
# the GitHub secret AZURE_CREDENTIALS (service principal, --sdk-auth JSON);
# copy it from the IgnyteCheerDance repo's Actions secrets.
#
# The two PUBLIC_SUPABASE_* values are baked into the build. They are safe to
# be public — the publishable key is designed for browsers and row-level
# security protects the data.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/ignyte-club-manager-webapp-ydl038]

permissions:
  contents: read

concurrency:
  group: deploy-swa
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ignyte-web-rg
  SWA_NAME: ${{ vars.AZURE_SWA_NAME || 'ignyte-club-manager' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  PUBLIC_SUPABASE_URL: https://iqpkeowpcqkmuffddzxj.supabase.co
  PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6RghDe8GTAIdKI530Oef8Q_alvNvTgg

jobs:
  deploy:
    name: Provision & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AZURE_CREDENTIALS secret exists
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::Missing repo secret AZURE_CREDENTIALS. Copy it from the IgnyteCheerDance repo: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision Static Web App (idempotent)
        id: prov
        run: |
          set -e
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors

          echo "→ Resource group (reuse if it already exists, any region)"
          az group show -n "$AZURE_RESOURCE_GROUP" -o none 2>/dev/null \
            || az group create -n "$AZURE_RESOURCE_GROUP" -l "$LOCATION" --only-show-errors -o none

          echo "→ Static Web App ($SWA_NAME, Free, $LOCATION)"
          if ! az staticwebapp create -n "$SWA_NAME" -g "$AZURE_RESOURCE_GROUP" -l "$LOCATION" \
                 --sku Free --only-show-errors -o none 2>/tmp/swaerr; then
            cat /tmp/swaerr || true
            az staticwebapp show -n "$SWA_NAME" -g "$AZURE_RESOURCE_GROUP" -o none 2>/dev/null \
              || { echo "Static Web App creation failed (see error above)."; exit 1; }
            echo "Static Web App already existed; continuing."
          fi

          HOST=$(az staticwebapp show -n "$SWA_NAME" -g "$AZURE_RESOURCE_GROUP" --query defaultHostname -o tsv)
          TOKEN=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Provisioned: https://$HOST"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.prov.outputs.token }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true

      - name: Smoke test
        run: |
          URL="https://${{ steps.prov.outputs.host }}"
          echo "Waiting for $URL …"
          up=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL/" || true)
            echo "home attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then up=1; break; fi
            sleep 10
          done
          if [ "$up" != "1" ]; then
            echo "::warning::Home not 200 yet — CDN may still be propagating: $URL"
            echo "### ⏳ Deployed; propagating — $URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail=0
          for path in /login /signup /dashboard /book /site.webmanifest /sw.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL$path" || true)
            echo "$path → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done

          {
            echo "### ✅ Ignyte Club Manager is live"
            echo ""
            echo "🔗 **$URL**"
            echo ""
            if [ "$fail" = "0" ]; then
              echo "- Home, login, signup, dashboard, book, PWA manifest, service worker: 200 ✓"
            else
              echo "- ⚠️ A page did not return 200 (see log)"
            fi
            echo ""
            echo "Remember: set this URL as the Site URL in Supabase → Authentication → URL Configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout || true
